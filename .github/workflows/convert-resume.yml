name: Convert Resume to PDF

on:
  push:
    paths:
      - 'resume.md'
      - 'style.css'

concurrency:
  group: convert-resume-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  convert-md-to-pdf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
        
      # Install Pandoc and wkhtmltopdf
      - name: Install Pandoc and wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf
          
      # Convert resume.md to resume.pdf with CSS
      - name: Convert Markdown to PDF
        run: |
          pandoc resume.md -o resume.html
          wkhtmltopdf --enable-local-file-access resume.html resume.pdf

      # Commit and push the generated PDF
      - name: Commit PDF
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add resume.pdf
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Generate resume.pdf from resume.md"
          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries"
          exit 1
